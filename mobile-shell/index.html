<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src https: http://127.0.0.1:3100 http://10.0.2.2:3100"
    />
    <title>The Dog Club</title>
    <style>
      :root {
        font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
        color: #173c34;
        background: #f8f1e7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(
            circle at 90% 3%,
            rgb(214 229 213 / 80%),
            transparent 30%
          ),
          #f8f1e7;
      }
      main {
        width: min(100%, 520px);
        margin: 0 auto;
        padding: max(28px, env(safe-area-inset-top)) 22px
          max(28px, env(safe-area-inset-bottom));
      }
      .brand {
        text-align: center;
        margin-bottom: 26px;
      }
      .brand img {
        width: 112px;
        height: 112px;
        object-fit: cover;
        border-radius: 50%;
        box-shadow: 0 16px 44px rgb(35 84 72 / 18%);
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1 {
        margin-bottom: 8px;
        font-size: 2rem;
      }
      .brand p,
      .muted {
        color: #49645d;
        line-height: 1.5;
      }
      .card {
        background: rgb(255 253 248 / 92%);
        border: 1px solid rgb(35 84 72 / 12%);
        border-radius: 24px;
        padding: 20px;
        box-shadow: 0 12px 34px rgb(35 84 72 / 8%);
      }
      label {
        display: grid;
        gap: 7px;
        margin: 14px 0;
        font-weight: 700;
        text-align: left;
      }
      input {
        width: 100%;
        padding: 14px 15px;
        border: 1px solid #b7c5bf;
        border-radius: 14px;
        background: white;
        color: #173c34;
        font: inherit;
      }
      textarea,
      select {
        width: 100%;
        padding: 14px 15px;
        border: 1px solid #b7c5bf;
        border-radius: 14px;
        background: white;
        color: #173c34;
        font: inherit;
      }
      textarea {
        min-height: 110px;
        resize: vertical;
      }
      input:focus {
        outline: 3px solid rgb(35 84 72 / 18%);
        border-color: #235448;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 13px 18px;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      .primary {
        width: 100%;
        color: white;
        background: #235448;
        margin-top: 8px;
      }
      .secondary {
        color: #235448;
        background: #e5eee9;
      }
      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .eyebrow {
        color: #8c674f;
        font-size: 0.74rem;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .club-list,
      .dog-list {
        display: grid;
        gap: 12px;
        margin-top: 16px;
      }
      .club {
        width: 100%;
        display: grid;
        gap: 4px;
        text-align: left;
        color: #173c34;
        background: white;
        border: 1px solid rgb(35 84 72 / 14%);
        border-radius: 18px;
      }
      .club small {
        color: #60746f;
        font-weight: 500;
      }
      .dog {
        width: 100%;
        display: grid;
        grid-template-columns: 52px 1fr;
        gap: 13px;
        align-items: start;
        padding: 14px;
        background: white;
        border-radius: 18px;
        color: inherit;
        text-align: left;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        font-size: 1.25rem;
        font-weight: 900;
        background: #ecdcc9;
      }
      .avatar.sage {
        background: #d9e6dc;
      }
      .avatar.rose {
        background: #f0d9d7;
      }
      .dog h3 {
        margin-bottom: 2px;
      }
      .dog p {
        margin: 7px 0 0;
        color: #587069;
        line-height: 1.4;
      }
      .pill {
        display: inline-block;
        margin-top: 7px;
        padding: 4px 8px;
        border-radius: 999px;
        color: #235448;
        background: #e5eee9;
        font-size: 0.72rem;
        font-weight: 800;
      }
      .profile-photo {
        display: block;
        width: 180px;
        height: 180px;
        margin: 20px auto;
        border-radius: 50%;
        object-fit: cover;
        background: #ecdcc9;
        box-shadow: 0 14px 34px rgb(35 84 72 / 16%);
      }
      .profile-photo.avatar {
        display: grid;
      }
      .profile-copy {
        text-align: center;
      }
      .profile-copy .muted {
        display: block;
        margin-bottom: 12px;
      }
      .message {
        min-height: 1.5em;
        margin: 12px 0 0;
        color: #8a3f34;
        text-align: center;
      }
      .setup {
        margin-top: 18px;
        font-size: 0.82rem;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <header class="brand">
        <img src="demo-dog.jpg" alt="A small white dog resting" />
        <h1>The Dog Club</h1>
        <p>
          Good friends, tasty treats, a little pampering and a place to belong.
        </p>
      </header>
      <section id="login-view" class="card">
        <span class="eyebrow">Member app</span>
        <h2>Welcome back</h2>
        <form id="login-form">
          <label
            >Dog Club server<input
              id="server"
              type="url"
              inputmode="url"
              autocomplete="url"
              required
          /></label>
          <label
            >Email<input
              id="email"
              type="email"
              inputmode="email"
              autocomplete="username"
              required
          /></label>
          <label
            >Password<input
              id="password"
              type="password"
              autocomplete="current-password"
              required
          /></label>
          <button class="primary" type="submit">Sign in</button>
        </form>
        <p id="login-message" class="message" role="alert"></p>
        <p class="muted setup">
          This development build keeps your password and session in memory only.
          Closing or refreshing the app signs you out.
        </p>
      </section>
      <section id="club-view" class="card hidden">
        <div class="topline">
          <div>
            <span class="eyebrow">Your memberships</span>
            <h2>Choose a club</h2>
          </div>
          <button id="sign-out" class="secondary" type="button">
            Sign out
          </button>
        </div>
        <p id="account-email" class="muted"></p>
        <div id="club-list" class="club-list"></div>
        <p id="club-message" class="message" role="alert"></p>
      </section>
      <section id="dog-view" class="card hidden">
        <div class="topline">
          <button id="back" class="secondary" type="button">Clubs</button
          ><button id="dog-sign-out" class="secondary" type="button">
            Sign out
          </button>
        </div>
        <span class="eyebrow">Club family</span>
        <h2 id="club-name"></h2>
        <div id="dog-list" class="dog-list"></div>
        <p id="dog-message" class="message" role="alert"></p>
      </section>
      <section id="profile-view" class="card hidden">
        <div class="topline">
          <button id="profile-back" class="secondary" type="button">
            Dogs
          </button>
          <button id="profile-sign-out" class="secondary" type="button">
            Sign out
          </button>
        </div>
        <div class="profile-copy">
          <img id="profile-photo" class="profile-photo hidden" alt="" />
          <div id="profile-avatar" class="profile-photo avatar"></div>
          <span id="profile-audience" class="eyebrow"></span>
          <h2 id="profile-name"></h2>
          <span id="profile-breed" class="muted"></span>
          <p id="profile-bio"></p>
          <span id="profile-owner" class="pill hidden">Your dog</span>
          <button id="edit-profile" class="primary hidden" type="button">
            Edit profile
          </button>
        </div>
        <p id="profile-message" class="message" role="alert"></p>
      </section>
      <section id="edit-view" class="card hidden">
        <div class="topline">
          <button id="edit-back" class="secondary" type="button">
            Profile
          </button>
          <span class="eyebrow">Edit your dog</span>
        </div>
        <form id="edit-form">
          <label>Name<input id="edit-name" maxlength="60" required /></label>
          <label>Breed<input id="edit-breed" maxlength="80" /></label>
          <label
            >Biography<textarea id="edit-bio" maxlength="400"></textarea>
          </label>
          <label
            >Profile colour<select id="edit-avatar">
              <option value="sand">Sand</option>
              <option value="sage">Sage</option>
              <option value="rose">Rose</option>
            </select></label
          >
          <label
            >Who can see this?<select id="edit-audience">
              <option value="private">Private</option>
              <option value="members">Club members</option>
              <option value="public">Public</option>
            </select></label
          >
          <button class="primary" type="submit">Save profile</button>
        </form>
        <p id="edit-message" class="message" role="alert"></p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
