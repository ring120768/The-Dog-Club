<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <title>The Dog Club</title>
    <style>
      :root {
        font-family: ui-rounded, system-ui, sans-serif;
        color: #173c34;
        background: #f8f1e7;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px
          max(24px, env(safe-area-inset-bottom));
        box-sizing: border-box;
      }
      main {
        width: min(100%, 420px);
        text-align: center;
      }
      img {
        width: 164px;
        height: 164px;
        object-fit: cover;
        border-radius: 50%;
        box-shadow: 0 16px 44px rgb(35 84 72 / 18%);
      }
      p {
        color: #49645d;
        line-height: 1.55;
      }
      small {
        display: block;
        margin-top: 28px;
        color: #71827d;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="demo-dog.jpg" alt="A small white dog resting" />
      <h1>The Dog Club</h1>
      <p>
        Good friends, tasty treats, a little pampering and a place to belong.
      </p>
      <small
        >This development build has not been connected to a Dog Club
        server.</small
      >
    </main>
  </body>
</html>
